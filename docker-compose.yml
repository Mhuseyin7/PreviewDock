services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      API_ADDR: :8080
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set_a_random_webhook_secret}
      DATABASE_URL: postgres://previewdock:${POSTGRES_PASSWORD:?set_a_database_password}@postgres:5432/previewdock?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: previewdock
      POSTGRES_DB: previewdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_a_database_password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U previewdock -d previewdock"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    read_only: true
    security_opt: [no-new-privileges:true]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: [./apps/web:/app]
    command: ["sh", "-c", "npm install && npm run dev"]
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1/deployments}
    ports: ["3000:3000"]
volumes: {postgres_data: {}}
